[package]
# Port of Farmer's Delight 1.21.1-1.3.4 (vectorwing/FarmersDelight, branch `1.21`,
# commit dd8b9b0bfec916a2da88a6d64e3a37f4a02c3259, MIT). Minecraft Java 1.21.1
# NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour (notes.md, FINDINGS.md).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "farmersdelight"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Farmer's Delight for Horizon: 77 foods, two crops, the seed click and the crop readout"
publish = false

[lib]
# The pure contract is `src/runtime.rs`; the crate root is `src/lib.rs`.
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). This port
# adds no registry dependency of its own.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
